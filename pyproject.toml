[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regroup-observability"
version = "0.1.0"
description = "Observabilidade compartilhada Re.Group: logging JSON estruturado, Sentry e /health transativo para serviços FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Re.Group Engenharia", email = "mauricio@regroup.com.br" }]
keywords = ["observability", "logging", "sentry", "healthcheck", "fastapi"]

# Núcleo zero-dependência: logging JSON funciona em qualquer serviço Python,
# inclusive workers/CLIs sem framework web.
dependencies = []

[project.optional-dependencies]
# Health router exige FastAPI; o middleware de request é ASGI puro (sem dep).
fastapi = ["fastapi>=0.100"]
sentry = ["sentry-sdk>=2.0"]
redis = ["redis>=5.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "fastapi>=0.100",
  "httpx>=0.27",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/m-m-t-a/regroup-observability"

[tool.hatch.build.targets.wheel]
packages = ["src/regroup_obs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
